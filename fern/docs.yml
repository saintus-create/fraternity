# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: fraternity.docs.buildwithfern.com
    edit-this-page:
      github:
        owner: fern-support
        repo: fraternity
        branch: main
      launch: dashboard
ai-search:
  location:
    - docs
ai-examples:
  enabled: false
title: Fraternity Incident Database | Documentation
layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header
tabs:
  database:
    display-name: Database
    icon: docs/assets/lucide/database.svg
  explore:
    display-name: Segmented Analytics
    icon: docs/assets/lucide/pie-chart.svg
  research:
    display-name: Research & Reports
    icon: docs/assets/lucide/book.svg
navigation:
  - tab: database
    layout:
      - section: Overview
        contents:
          - page: Welcome
            path: docs/pages/welcome.mdx
            icon: docs/assets/lucide/home.svg
          - page: Master Directory
            path: docs/pages/master-directory.mdx
            icon: docs/assets/lucide/book-user.svg
          - page: Aggregate Statistics
            path: docs/pages/statistics.mdx
            icon: docs/assets/lucide/bar-chart-3.svg
      - section: Complete Records
        contents:
          - page: Full Incident Dataset
            path: docs/pages/victim-data.mdx
            icon: docs/assets/lucide/table.svg
      - section: Informational
        contents:
          - page: Support Resources
            path: docs/pages/support.mdx
            icon: docs/assets/lucide/headphones.svg
          - changelog: docs/changelog

  - tab: explore
    layout:
      - section: Timeline Breakdown
        icon: docs/assets/lucide/clock.svg
        contents:
          - page: Early Years (1873–1969)
            path: docs/pages/timeline-early.mdx
            icon: docs/assets/lucide/hourglass.svg
          - page: 1970s & 1980s
            path: docs/pages/timeline-70s80s.mdx
            icon: docs/assets/lucide/hourglass.svg
          - page: 1990s & 2000s
            path: docs/pages/timeline-90s00s.mdx
            icon: docs/assets/lucide/hourglass.svg
          - page: 2010–2019
            path: docs/pages/timeline-10s.mdx
            icon: docs/assets/lucide/calendar.svg
          - page: 2020–Present
            path: docs/pages/timeline-20s.mdx
            icon: docs/assets/lucide/calendar.svg-check
          - page: Unknown Year
            path: docs/pages/timeline-unknown.mdx
            icon: docs/assets/lucide/help-circle.svg
      - section: By Cause of Death
        icon: docs/assets/lucide/skull.svg
        contents:
          - page: Alcohol-Related
            path: docs/pages/cause-alcohol.mdx
            icon: docs/assets/lucide/wine.svg
          - page: Falls
            path: docs/pages/cause-falls.mdx
            icon: docs/assets/lucide/user-minus.svg
          - page: Vehicle & Traffic
            path: docs/pages/cause-vehicle.mdx
            icon: docs/assets/lucide/car.svg
          - page: Drowning
            path: docs/pages/cause-drowning.mdx
            icon: docs/assets/lucide/waves.svg
          - page: Physical Trauma & Abuse
            path: docs/pages/cause-physical.mdx
            icon: docs/assets/lucide/hand.svg
          - page: Other Causes
            path: docs/pages/cause-other.mdx
            icon: docs/assets/lucide/alert-circle.svg
      - section: Organization & Geography
        icon: docs/assets/lucide/building-2.svg
        contents:
          - page: Greek Organizations
            path: docs/pages/by-organization.mdx
            icon: docs/assets/lucide/building-2.svg
          - page: Geographic Distribution
            path: docs/pages/by-state.mdx
            icon: docs/assets/lucide/map-pin.svg

  - tab: research
    layout:
      - section: Hazing Mortality Research
        contents:
          - page: Overview & Methodology
            path: docs/pages/hazing-overview.mdx
            icon: docs/assets/lucide/file-text.svg
          - page: Modern Case Studies
            path: docs/pages/modern-cases.mdx
            icon: docs/assets/lucide/search.svg
          - page: Pi Kappa Phi Analysis
            path: docs/pages/pi-kappa-phi.mdx
            icon: docs/assets/lucide/bar-chart-2.svg
          - page: Findings & Recommendations
            path: docs/pages/hazing-conclusions.mdx
            icon: docs/assets/lucide/check-circle.svg
            
      - section: Cover-ups & Obfuscation
        contents:
          - page: Obfuscation Patterns
            path: docs/pages/obfuscation-patterns.mdx
            icon: docs/assets/lucide/venetian-mask.svg
          - page: Major Case Studies
            path: docs/pages/obfuscation-case-studies.mdx
            icon: docs/assets/lucide/gavel.svg
          - page: Legal Trends & Findings
            path: docs/pages/obfuscation-legal.mdx
            icon: docs/assets/lucide/scale.svg
            
      - section: Drug Enforcement Actions
        contents:
          - page: Major Operations
            path: docs/pages/drugs-operations.mdx
            icon: docs/assets/lucide/pill.svg
          - page: Seizures & Statistics
            path: docs/pages/drugs-statistics.mdx
            icon: docs/assets/lucide/trending-up.svg

navbar-links:
  - type: minimal
    text: GitHub
    url: https://github.com/fern-support/fraternity
  - type: filled
    text: Dashboard
    url: https://dashboard.buildwithfern.com
  - type: github
    value: https://github.com/fern-support/fraternity
colors:
  accent-primary:
    dark: "#ffffff"
    light: "#000000"
  background:
    dark: "#111113"
    light: "#FFFFFF"
theme:
  page-actions: toolbar
  footer-nav: minimal
logo:
  dark: docs/assets/logo.svg
  light: docs/assets/logo.svg
  height: 20
  href: https://fraternity.docs.buildwithfern.com
favicon: docs/assets/favicon.svg
