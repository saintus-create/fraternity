# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: fraternity.docs.buildwithfern.com
    edit-this-page:
      github:
        owner: fern-support
        repo: fraternity
        branch: main
      launch: dashboard
ai-search:
  location:
    - docs
ai-examples:
  enabled: false
title: Fraternity Incident Database | Documentation
layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header
tabs:
  home:
    display-name: Database
    icon: home
  timeline:
    display-name: Timeline
    icon: clock
  causes:
    display-name: By Cause
    icon: skull-crossbones
  orgs:
    display-name: Organizations
    icon: building-columns
  geography:
    display-name: Geography
    icon: map
  research:
    display-name: Research
    icon: book
navigation:
  - tab: home
    layout:
      - section: Overview
        contents:
          - page: Welcome
            path: docs/pages/welcome.mdx
            icon: fa-duotone fa-house
          - page: Statistics
            path: docs/pages/statistics.mdx
            icon: fa-duotone fa-chart-bar
          - page: Full Dataset
            path: docs/pages/victim-data.mdx
            icon: fa-duotone fa-database
      - section: Resources
        contents:
          - page: Support
            path: docs/pages/support.mdx
            icon: fa-duotone fa-headset
      - section: Changelog
        contents:
          - changelog: docs/changelog

  - tab: timeline
    layout:
      - section: Timeline
        contents:
          - page: Early Years (1873–1969)
            path: docs/pages/timeline-early.mdx
            icon: fa-duotone fa-hourglass-start
          - page: 1970s & 1980s
            path: docs/pages/timeline-70s80s.mdx
            icon: fa-duotone fa-hourglass-half
          - page: 1990s & 2000s
            path: docs/pages/timeline-90s00s.mdx
            icon: fa-duotone fa-hourglass-end
          - page: 2010–2019
            path: docs/pages/timeline-10s.mdx
            icon: fa-duotone fa-calendar
          - page: 2020–Present
            path: docs/pages/timeline-20s.mdx
            icon: fa-duotone fa-calendar-check
          - page: Unknown Year
            path: docs/pages/timeline-unknown.mdx
            icon: fa-duotone fa-question

  - tab: causes
    layout:
      - section: By Cause of Death
        contents:
          - page: Alcohol-Related
            path: docs/pages/cause-alcohol.mdx
            icon: fa-duotone fa-wine-glass
          - page: Falls
            path: docs/pages/cause-falls.mdx
            icon: fa-duotone fa-person-falling
          - page: Vehicle & Traffic
            path: docs/pages/cause-vehicle.mdx
            icon: fa-duotone fa-car-burst
          - page: Drowning
            path: docs/pages/cause-drowning.mdx
            icon: fa-duotone fa-water
          - page: Physical Trauma & Abuse
            path: docs/pages/cause-physical.mdx
            icon: fa-duotone fa-hand-fist
          - page: Other Causes
            path: docs/pages/cause-other.mdx
            icon: fa-duotone fa-circle-exclamation

  - tab: orgs
    layout:
      - section: Greek Organizations
        contents:
          - page: All Organizations
            path: docs/pages/by-organization.mdx
            icon: fa-duotone fa-building-columns

  - tab: geography
    layout:
      - section: Geographic Data
        contents:
          - page: By State
            path: docs/pages/by-state.mdx
            icon: fa-duotone fa-map-location-dot

  - tab: research
    layout:
      - section: Research Reports
        contents:
          - page: Hazing Mortality Research
            path: docs/pages/hazing-mortality-research.mdx
            icon: fa-duotone fa-file-lines
          - page: Obfuscated & Misattributed Deaths
            path: docs/pages/obfuscated-cases.mdx
            icon: fa-duotone fa-mask
          - page: Drug Enforcement Actions
            path: docs/pages/drug-enforcement.mdx
            icon: fa-duotone fa-pills

navbar-links:
  - type: minimal
    text: GitHub
    url: https://github.com/fern-support/fraternity
  - type: filled
    text: Dashboard
    url: https://dashboard.buildwithfern.com
  - type: github
    value: https://github.com/fern-support/fraternity
colors:
  accent-primary:
    dark: "#ffffff"
    light: "#000000"
  background:
    dark: "#111113"
    light: "#FFFFFF"
theme:
  page-actions: toolbar
  footer-nav: minimal
logo:
  dark: docs/assets/logo.svg
  light: docs/assets/logo.svg
  height: 20
  href: https://fraternity.docs.buildwithfern.com
favicon: docs/assets/favicon.svg
